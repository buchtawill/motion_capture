#User Configuration

#OE_TERMINAL = "tmux"
EXTRA_DTFILE_PREFIX = "system"
EXTRA_DTFILES_BUNDLE = "1"
UBOOT_IMAGE_BLOB:k26 = "0"
UBOOT_DTFILE_PREFIX:kria = "system"
UBOOT_DT_FILES:kria = ""
INITRAMFS_PACKAGES:append = " mac-config "
# modetest / kms utilities for DRM bring-up (libdrm-tests sub-package isn't
# exposed in rootfs menuconfig, so pull it in explicitly)
IMAGE_INSTALL:append = " libdrm-tests"
# Keep the mocap app build dirs so a recipe-only rebuild leaves the compiled
# binary at a stable path (image/usr/bin/) for fast copy-to-NFS iteration.
RM_WORK_EXCLUDE += "mocap-hdmi-drm mocap-hdmi-memcp"
IMAGE_BOOT_FILES:zynqmp = "ramdisk.cpio.gz.u-boot,boot.scr,Image,system.dtb,system-zynqmp-sck-kv-g-revB.dtb"
